name: Update BTC bot data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (не “раз в час”)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run bot
        run: |
          python btc_bot.py

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/**
          git commit -m "Update BTC bot data" || echo "No changes"
          git push
