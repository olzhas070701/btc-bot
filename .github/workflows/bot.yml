name: BTC Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # запуск каждые 15 минут
  workflow_dispatch:          # ручной запуск

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 👈 нужно для авто-коммитов

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python btc_bot.py

      # 👉 Вариант 1: Авто-коммит в репозиторий
      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ latest/ config/
          git commit -m "Update BTC bot data (run ${{ github.run_id }})" || echo "No changes to commit"
          git push

      # 👉 Вариант 2: Скачиваемый архив (Artifacts)
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ github.run_id }}
          path: archive/**
